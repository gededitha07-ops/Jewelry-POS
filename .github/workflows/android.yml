name: Build Jewelry POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.jewelrypos.app",
            "appName": "Jewelry POS",
            "webDir": "www"
          }
          EOF

      - name: Create Android Project
        run: npx cap add android
        
    
      - name: Add Native Plugins
        run: |
          mkdir -p android/app/src/main/java/com/jewelrypos/app

          cp native/BluetoothPrinterPlugin.java android/app/src/main/java/com/jewelrypos/app/
          cp native/PDFPrinterPlugin.java android/app/src/main/java/com/jewelrypos/app/

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/jewelrypos/app/MainActivity.java")
          content = path.read_text()

          content = content.replace(
              "import com.getcapacitor.BridgeActivity;",
              """import com.getcapacitor.BridgeActivity;
          import com.jewelrypos.app.BluetoothPrinterPlugin;
          import com.jewelrypos.app.PDFPrinterPlugin;"""
          )

          content = content.replace(
              "public class MainActivity extends BridgeActivity {",
              """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(BluetoothPrinterPlugin.class);
                  registerPlugin(PDFPrinterPlugin.class);
                  super.onCreate(savedInstanceState);
              }"""
          )

          path.write_text(content)
          PY
 

        
      - name: Add Bluetooth Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
          """

          if "android.permission.BLUETOOTH_CONNECT" not in content:
              content = content.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          path.write_text(content)
          PY

      

      - name: Sync Android Project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jewelry-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
